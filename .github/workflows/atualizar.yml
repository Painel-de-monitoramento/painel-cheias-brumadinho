name: Atualizar painel de cheias

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'simulador.html', 'estacoes.html', 'estilo.css', '*.js', 'vendor/**', 'motor.py', 'dados.py', 'historico.json', 'reguas.json', 'coletor.py', 'validar.py', 'testes/**', '.github/workflows/atualizar.yml']

# Sem permissões por padrão; cada job recebe só o necessário.
permissions: {}

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write          # gravar cache, estado e snapshot no repositório
    outputs:
      resultado: ${{ steps.res.outputs.resultado }}
      artefato: ${{ steps.site.outputs.artefato }}
    steps:
      # Ações fixadas por SHA (tag correspondente no comentário)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          ref: main
      - name: Garantir a versão mais recente da main (evita que uma execução enfileirada use estado antigo)
        run: git pull --ff-only origin main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020     # v4
        with:
          node-version: '20'
      - name: Testes de aceitação, dados e paridade do motor de decisão
        run: python -m unittest discover -s testes -v
      - name: Coletar telemetria e chuva
        id: coleta
        continue-on-error: true
        env:
          ANA_HIDRO_USUARIO: ${{ secrets.ANA_HIDRO_USUARIO }}
          ANA_HIDRO_SENHA: ${{ secrets.ANA_HIDRO_SENHA }}
        run: |
          cp data.json /tmp/data_anterior.json
          codigo=1
          for i in 1 2; do
            set +e; python coletor.py /tmp/data_novo.json; codigo=$?; set -e
            if [ "$codigo" = 0 ] || [ "$codigo" = 2 ]; then
              if python validar.py /tmp/data_novo.json; then mv /tmp/data_novo.json data.json; break; fi
              codigo=3
            fi
            echo "::warning::Tentativa $i da coleta terminou com código $codigo"; sleep 30
          done
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          [ "$codigo" = 0 ]
      - name: Manter o último snapshot válido quando não houve snapshot novo
        if: steps.coleta.outputs.codigo != '0' && steps.coleta.outputs.codigo != '2'
        run: |
          cp /tmp/data_anterior.json data.json
          echo "::error::Coleta falhou (código ${{ steps.coleta.outputs.codigo }}); mantido o último data.json válido. O painel exibe a idade real dos dados."
      - name: Registrar o resultado operacional (operacao.json)
        id: res
        env:
          CODIGO: ${{ steps.coleta.outputs.codigo }}
        run: |
          python - <<'EOF'
          import json, os, datetime as dt
          tz = dt.timezone(dt.timedelta(hours=-3)); agora = dt.datetime.now(tz).strftime('%Y-%m-%dT%H:%M:%S')
          try: ant = json.load(open('operacao.json'))
          except Exception: ant = {}
          c = os.environ.get('CODIGO') or '1'
          res = {'0': 'ok', '2': 'degradado'}.get(c, 'falha')
          d = json.load(open('data.json'))
          op = {'ultima_tentativa': agora, 'resultado': res, 'codigo': int(c) if c.isdigit() else None,
                'ultima_coleta_valida': d.get('coleta') if res != 'falha' else ant.get('ultima_coleta_valida', d.get('coleta')),
                'ultima_coleta_completa': agora if res == 'ok' else ant.get('ultima_coleta_completa'),
                'falhas_consecutivas': 0 if res == 'ok' else int(ant.get('falhas_consecutivas') or 0) + 1,
                'mensagem': {'ok': 'coleta completa', 'degradado': 'snapshot gravado, mas a régua ou Belo Vale não foram baixados',
                             'falha': 'coleta sem snapshot válido; mantido o anterior'}[res],
                'run_id': os.environ['GITHUB_RUN_ID']}
          json.dump(op, open('operacao.json', 'w'), ensure_ascii=False)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'resultado={res}\n')
          print(op)
          EOF
      - name: Montar site
        id: site
        run: |
          python validar.py data.json
          mkdir -p _site/vendor
          cp index.html simulador.html estacoes.html estilo.css motor.js aovivo.js painel.js simulador.js estacoes.js comum.js data.json operacao.json historico.json reguas.json _site/
          cp vendor/* _site/vendor/
          python - <<'EOF'
          import json, os, datetime as dt
          d = json.load(open('data.json'))
          v = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_number': os.environ['GITHUB_RUN_NUMBER'], 'commit': os.environ['GITHUB_SHA'],
               'id_snapshot': d.get('id_snapshot'), 'geracao_snapshot': d.get('geracao_snapshot'),
               'montado': dt.datetime.now(dt.timezone(dt.timedelta(hours=-3))).strftime('%Y-%m-%dT%H:%M:%S')}
          json.dump(v, open('_site/versao.json', 'w'))
          EOF
          echo "artefato=sim" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site
      - name: Salvar dados, estado e resultado operacional no repositório
        run: |
          git config user.name "painel-cheias"
          git config user.email "painel-cheias@users.noreply.github.com"
          if [ "${{ steps.res.outputs.resultado }}" = "falha" ]; then git checkout -- data.json; git add operacao.json
          else git add data.json tel_cache.json modelo_hist.json estado.json operacao.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Dados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') (${{ steps.res.outputs.resultado }})"
          for i in 1 2 3; do
            # nunca sobrescrever um snapshot mais novo gravado por outra execução
            git fetch origin main
            remoto=$(git show origin/main:data.json | python -c "import json,sys;print(json.load(sys.stdin).get('coleta',''))")
            local=$(python -c "import json;print(json.load(open('data.json')).get('coleta',''))")
            if [ "$remoto" \> "$local" ]; then echo "::warning::O repositório já tem um snapshot mais novo ($remoto); nada gravado"; exit 0; fi
            git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            echo "::warning::Push falhou (tentativa $i)"; sleep $((i*10))
          done
          echo "::error::Não foi possível gravar os dados no repositório"; exit 1
      - name: Sinalizar falha da coleta (a execução fica vermelha mesmo com a publicação de contingência)
        if: steps.res.outputs.resultado != 'ok'
        run: |
          echo "::error::Resultado da coleta: ${{ steps.res.outputs.resultado }}. Veja operacao.json e o log do passo de coleta."
          exit 1

  publicar:
    needs: coletar
    if: always() && needs.coletar.outputs.artefato == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
