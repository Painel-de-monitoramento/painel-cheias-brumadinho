name: Atualizar painel de cheias

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'simulador.html', 'estilo.css', 'historico.json', 'coletor.py', '.github/workflows/atualizar.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar telemetria da ANA e chuva
        run: python coletor.py data.json
      - name: Salvar dados no repositório
        run: |
          git config user.name "painel-cheias"
          git config user.email "painel-cheias@users.noreply.github.com"
          git add data.json tel_cache.json modelo_hist.json
          git diff --cached --quiet || git commit -m "Dados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -X ours || true
          git push || true
      - name: Montar site
        run: mkdir -p _site && cp index.html simulador.html estilo.css data.json historico.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
