name: Diagnóstico CEMADEN (manual)

# Executado só manualmente. Testa o acesso à PED do CEMADEN com os segredos e mostra a estrutura dos dados
# das estações da Z1, sem gravar nada e sem exibir credenciais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - name: Consultar a PED do CEMADEN
        env:
          CEMADEN_USUARIO: ${{ secrets.CEMADEN_USUARIO }}
          CEMADEN_SENHA: ${{ secrets.CEMADEN_SENHA }}
        run: python sonda_cemaden.py; python cemaden.py --diagnostico
